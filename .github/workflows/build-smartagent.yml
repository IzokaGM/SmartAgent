        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build SmartAgent debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$GITHUB_WORKSPACE" assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" \
             "apk-output/SmartAgent-v1.0.0-debug.apk"

      - name: Upload SmartAgent APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAgent-v1.0.0-APK
          path: apk-output/SmartAgent-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
