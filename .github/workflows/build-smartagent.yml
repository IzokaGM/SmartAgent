          SMARTAGENT_SOURCE

          echo "97e2ca94dc33b306df50d6cce86fad05d07eefc98854b7c54ef42805a38b6fad  $source_zip" | sha256sum --check -

          mkdir -p "$extract_root"
          unzip -q "$source_zip" -d "$extract_root"

          settings_file="$(find "$extract_root" -type f -name 'settings.gradle.kts' | head -n 1)"
          if [[ -z "$settings_file" ]]; then
            echo "Embedded SmartAgent Android project was not found."
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          echo "SMARTAGENT_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "SmartAgent source recreated successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build SmartAgent debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$SMARTAGENT_PROJECT_DIR" assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          cp "$SMARTAGENT_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "apk-output/SmartAgent-v0.3.0-debug.apk"

      - name: Upload SmartAgent APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAgent-v0.3.0-APK
          path: apk-output/SmartAgent-v0.3.0-debug.apk
          if-no-files-found: error
          retention-days: 30
