name: Install Full SmartAgent Project and Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  install-and-build:
    name: Upload Project Files and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

