name: Build and Upload SmartAgent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Find or extract the Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "settings.gradle.kts" || -f "settings.gradle" ]]; then
            project_dir="."
          else
            archive="$(find . -maxdepth 3 -type f -iname 'SmartAgent*.zip' | head -n 1)"

            if [[ -z "$archive" ]]; then
              echo "SmartAgent source ZIP was not found."
              echo "Upload SmartAgent-v0.1-source.zip or extract its contents into the repository."
              exit 1
            fi

            mkdir -p extracted-smartagent
            unzip -q "$archive" -d extracted-smartagent

            settings_file="$(find extracted-smartagent -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"

            if [[ -z "$settings_file" ]]; then
              echo "The ZIP does not contain an Android Gradle project."
              exit 1
            fi

            project_dir="$(dirname "$settings_file")"
          fi

          echo "SMARTAGENT_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Android project found at: $project_dir"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build SmartAgent debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$SMARTAGENT_PROJECT_DIR" assembleDebug --stacktrace

      - name: Prepare APK for download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          cp "$SMARTAGENT_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
             "apk-output/SmartAgent-debug.apk"

      - name: Upload SmartAgent APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAgent-APK
          path: apk-output/SmartAgent-debug.apk
          if-no-files-found: error
          retention-days: 30
