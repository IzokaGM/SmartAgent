          SMARTAGENT_SOURCE

          echo "d2635c9556d707a8cc49fb652feb6f229a4c254fd571c25e96e2eb4aa1b8c6a0  $source_zip" | sha256sum --check -

          mkdir -p "$extract_root"
          unzip -q "$source_zip" -d "$extract_root"

          project_root="$extract_root/SmartAgent"
          if [[ ! -f "$project_root/settings.gradle.kts" ]]; then
            echo "Embedded SmartAgent Android project was not found."
            exit 1
          fi

          installed_marker="$GITHUB_WORKSPACE/.smartagent-project-version"
          installed_version="$(cat "$installed_marker" 2>/dev/null || true)"

          if [[ "$installed_version" != "1.1.0" ]]; then
            rsync -a --exclude='.github/' "$project_root/" "$GITHUB_WORKSPACE/"
            printf '1.1.0\n' > "$installed_marker"
            echo "Complete SmartAgent project prepared for repository upload."
          else
            echo "SmartAgent 1.1.0 project is already installed."
          fi

          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Complete SmartAgent project is already in the repository."
          else
            git commit -m "Install complete SmartAgent 1.1.0 project"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "Complete SmartAgent project uploaded to the repository."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build SmartAgent debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$GITHUB_WORKSPACE" assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/debug/app-debug.apk" \
             "apk-output/SmartAgent-v1.1.0-debug.apk"

      - name: Upload SmartAgent APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartAgent-v1.1.0-APK
          path: apk-output/SmartAgent-v1.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
